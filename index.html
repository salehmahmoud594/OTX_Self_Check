      /* =====================================================================
   GEMINI AI — reads a session's score + wrong-answer notes and returns
   a per-topic status suggestion with a one-line reason. Kept completely
   separate from appState/export: the API key lives in its own
   localStorage key only, so it is never included in your JSON backups.
===================================================================== */
      const GEMINI_CFG_KEY = "otx_gemini_cfg_v1";
      /**
       * IMPORTANT: this is obfuscation, not encryption. There is no server here
       * to hold a real secret — this whole app is one static HTML file the
       * browser can read, so the "key" used to reverse this is sitting right
       * here in the same file anyone can open. All this does is stop the API
       * key from being an instantly-readable plaintext string if someone
       * glances at localStorage in devtools; it will not stop someone who
       * actually reads this source. Real protection = restrict the key itself
       * (quota/referrer limits in Google AI Studio), not client-side hiding.
       */
      function _obf(str) {
        try {
          return (
            "obf1:" +
            btoa(unescape(encodeURIComponent(str)).split("").reverse().join(""))
          );
        } catch (e) {
          return str;
        }
      }
      function _deobf(str) {
        if (typeof str !== "string" || !str.startsWith("obf1:")) return str; // legacy plaintext, pass through
        try {
          return decodeURIComponent(
            escape(atob(str.slice(5)).split("").reverse().join("")),
          );
        } catch (e) {
          return "";
        }
      }
      function getGeminiConfig() {
        try {
          const raw = localStorage.getItem(GEMINI_CFG_KEY);
          if (raw) {
            const cfg = JSON.parse(raw);
            return { ...cfg, apiKey: _deobf(cfg.apiKey || "") };
          }
        } catch (e) {}
        return { apiKey: "", model: "gemini-3.6-flash" };
      }
      function saveGeminiConfig(cfg) {
        try {
          localStorage.setItem(
            GEMINI_CFG_KEY,
            JSON.stringify({ ...cfg, apiKey: _obf(cfg.apiKey || "") }),
          );
          return true;
        } catch (e) {
          return false;
        }
      }

      function buildGeminiPrompt(
        topics,
        correct,
        total,
        notes,
        rawText,
        wrongNums,
        skippedNums,
      ) {
        const topicLines = topics
          .map(
            (t) =>
              `- id:"${t.id}" | [${t.cat}] ${t.topic} | current_status:${t.curStatus || "not_started"}`,
          )
          .join("\n");
        const hasRaw = !!(rawText && rawText.trim());
        const skippedCount = (Number(total) || 0) - (Number(correct) || 0);
        const wrongList = (wrongNums || "").match(/\d+/g) || [];
        const skippedList = (skippedNums || "").match(/\d+/g) || [];
        const hasStructured = wrongList.length > 0 || skippedList.length > 0;

        const rawBlock = hasRaw
          ? `Full quiz text as pasted by the student (question numbers, choices, marked correct answers). This is GROUND TRUTH for question content — prefer it over the notes below whenever both are present and they conflict:
"""${rawText}"""`
          : `(no full quiz text was pasted — only the fields below are available, so extraction is limited to what's explicitly written there)`;

        const structuredBlock = hasStructured
          ? `The student explicitly listed these question numbers using a dedicated field (this is their most deliberate, structured input — treat it as authoritative for WHICH numbers to focus on):
- Marked WRONG: ${wrongList.length ? wrongList.join(", ") : "(none listed)"}
- Marked SKIPPED: ${skippedList.length ? skippedList.join(", ") : "(none listed)"}
IMPORTANT — the student sometimes second-guesses their own question numbering (they may say so in the notes below, e.g. "not sure which number this was" / "مش متأكد من الرقم" / "متلغبط"). Whenever the full quiz text is present, VERIFY every number above against it: confirm a question with that exact number actually exists in the parsed text. If a listed number doesn't exist in the quiz, or the notes explicitly flag uncertainty about numbering, do not silently trust the number — say so plainly in that topic's reason (e.g. "الرقم اللي كتبته مش متطابق مع الكويز، يفضل تتأكد منه") instead of presenting it as a confirmed fact.`
          : `(the student didn't fill in the structured wrong/skipped number fields — rely on the raw quiz text and/or notes below instead)`;

        return `You are helping a student self-assess their knowledge after a quiz on optical transmission engineering (Huawei HCIA/HCIP + optical courses).

They were quizzed on exactly these topics (this is the COMPLETE and ONLY valid list of topic ids — do not invent new ones, do not merge two of them together, do not add a topic id that isn't in this list even if the quiz content suggests one). Each line also shows "current_status": the student's last saved mastery level for that topic BEFORE this quiz — use it only as instructed in STEP 2 below, never as a hint to bias a topic that WAS tested in this quiz:
${topicLines}

Score: ${correct} out of ${total} correct (so ${skippedCount >= 0 ? skippedCount : "an unknown number of"} question(s) were wrong or skipped in total).

${rawBlock}

${structuredBlock}

Their freeform notes — may add context, or may describe a mistake by its CONTENT instead of a number when the student isn't sure of the exact question number (may be in Arabic, English, or mixed):
"""${notes || "(no notes provided)"}"""

STEP 0 — Extract every wrong/skipped question (do this silently before writing your answer, do not output this step):
- Start from the structured wrong/skipped number lists above when present — verify each number exists in the raw quiz text (if present) and pull that question's actual content from there. If your count of wrong+skipped from the structured lists doesn't match "${skippedCount}", note the discrepancy rather than silently picking one source.
- If the notes describe a mistake by CONTENT rather than by number (e.g. "the question about the LOM alarm" instead of "question 6"), search the raw quiz text for the question that matches that description and use its actual number — mention the number you identified in the reason so the student can double-check you found the right one. Never guess a number when a description is given; always locate it in the actual text.
- If the full quiz text is present but neither the structured fields nor the notes give usable numbers, fall back to going question by question and treat the total wrong/skipped count from the score as your target to find, recording each mismatched question's number, what concept/byte/alarm/signal/structure it was actually testing (using only terms that literally appear in that question's text, choices, or rationale — never a term you're guessing), and what the correct answer was. A skipped question is extracted exactly the same way as a wrong one — never treat "skipped" as neutral or ignore it.
- If only notes are present (no raw quiz text, no structured numbers): list every distinct mistake mentioned, using ONLY the exact technical terms that literally appear in the notes text. Do not substitute, guess, or infer a different term that sounds similar but isn't written in the notes — if unsure which exact term applies, describe the mistake generically instead of naming a specific term.
- Never invent a mistake, a wrong-answer choice, a question number, or a reason that isn't grounded in the pasted quiz text or the notes. If you cannot tell why a question was missed, say so generically rather than fabricating a plausible-sounding explanation.

STEP 1 — Topic matching:
- Priority rule — explicit topic tags: If a question carries an explicit tag in the format [topic: <id>] (added by NotebookLM at generation time), use that id directly as the match without re-inferring from content. Only verify that the id actually exists in the topic list above; if it doesn't, fall back to content-based matching and note the discrepancy in the reason.
- Specificity rule: For each item extracted in step 0 (whether tagged or not), match it to the SINGLE most specific topic id in the list above, based on what that specific question was actually testing. Topics can look adjacent but are NOT interchangeable — e.g. a question about OTUCn/beyond-100G frame structure belongs ONLY to a topic id about OTUCn/Beyond-100G if one exists in the list, never to a general "OTN framing structure (OTU/ODU/OPU)" topic id, even though both involve OTN framing.
- Detailed-over-general rule: When the list contains BOTH a general topic (e.g. [Course Curriculum Modules] Performance Monitoring) AND a more detailed topic on the same concept (e.g. [Performance Monitoring (Detailed)] Monitoring Parameters: OSNR...), ALWAYS assign the question to the MORE DETAILED topic id. Never assign to a general/curriculum-overview topic if a matching detailed topic exists in the same session list.
- Special case: if a mistake is clearly about a narrower/specialized concept (e.g. OTUCn) but NO topic id for that specialized concept exists anywhere in the list above, you must still attach it to the closest general topic id — but in that topic's "reason" you must describe it as a mistake specific to that narrower concept (e.g. "غلطة في OTUCn تحديدًا"), not as a general weakness in the broad topic itself, since most of the broad topic may still be solid. If that same broad topic id ALSO absorbs a separate, genuinely general mistake (not tied to the narrow concept), keep the two visibly distinct in the reason (e.g. two short clauses, one flagged as OTUCn-specific and one as general) rather than merging them into a single blended description that implies they're the same kind of gap.

STEP 2 — Status rubric (apply per topic id, based only on the items matched to THAT id in step 1, and — when the full quiz text is present — how many total questions from that topic id you can identify in it):
- "weak": at least one matched item shows a genuine conceptual misunderstanding — e.g. confusing LCK with LOM (different alarms with different causes), mixing up which layer a function belongs to, or not knowing what a mechanism does at all — OR a skipped question on that topic with no other evidence the concept is solid — OR more than one wrong/skipped item out of very few questions on that topic. The key test: would fixing this require re-learning a concept, not just re-checking a number?
- "good": ALL matched items are the student slipping on a narrow factual detail while their reasoning about the general concept was correct — e.g. writing column 14 instead of 15 for OPU overhead (knows it's in the overhead, wrong column), or mixing up the label "1+1" vs "1:1" while fully understanding how protection switching works. The key test: would a quick re-read of a table fix this, without needing to re-learn the concept?
- If a topic id has multiple matched items of different severity, the status is "weak" (conceptual/skip issues dominate), but the reason must still name each distinct item separately rather than blending them into one vague description — do not describe a numeric slip as "conceptual" just because it shares a topic id with a real conceptual error.
- "mastered": at least one question you can point to in the raw quiz text belongs to this topic AND none of those questions were wrong or skipped — i.e. you have positive evidence, not just absence of evidence.
- If a topic id has no items matched to it in step 1, first check (only when the raw quiz text is present) whether you can identify ANY question in that text that actually tests this topic at all:
  - If you CAN identify at least one such question and it was answered correctly: status is "mastered", and the reason should reference the actual question number(s) that confirm it — never say "all questions" or "every question" if you're only pointing to one.
  - If you CANNOT identify any question testing this topic in the quiz (it simply wasn't covered by this particular quiz): status MUST be exactly that topic's given "current_status" value, copied unchanged (including "not_started" if that's what it is) — never guess "good" or any other value as a default. The reason MUST say explicitly that this quiz didn't specifically test this topic and the status is carried over unchanged, not evidence from this quiz. NEVER phrase this as "answered correctly" or imply questions were answered when none existed — that is a fabrication.
  - If no raw quiz text is present at all (notes-only mode) and a topic has no matched items, status MUST also be exactly that topic's given "current_status", copied unchanged, with the same "carried over, not tested this time" reason — do not infer a different status from the overall score for topics that weren't specifically flagged as wrong/skipped.

Respond with ONLY raw JSON (no markdown fences, no commentary), in this exact shape:
{"ratings":[{"id":"<topic id from the list above>","status":"weak|good|mastered|not_started","reason":"one short sentence in Arabic, under 18 words, naming the exact question number(s) and mistake(s) when available, using only terms grounded in step 0 — never a term you're inferring or guessing"}]}
"not_started" is only valid when it's the exact carried-over current_status of a topic this quiz didn't test (per STEP 2) — never assign it to a topic that WAS tested.

Include every topic id from the list exactly once, and no ids that aren't in the list. Nothing else in your response.`;
      }

      function extractJson(text) {
        if (!text) return null;
        let cleaned = text
          .trim()
          .replace(/^```(json)?/i, "")
          .replace(/```$/, "")
          .trim();
        const start = cleaned.indexOf("{");
        const end = cleaned.lastIndexOf("}");
        if (start === -1 || end === -1) return null;
        try {
          return JSON.parse(cleaned.slice(start, end + 1));
        } catch (e) {
          return null;
        }
      }

      const aiPendingRetry = {}; // sessionId -> {deadline, intervalId}

      async function analyzeSessionWithGemini(sessionId) {
        const s = appState.sessions.find((x) => x.id === sessionId);
        if (!s) return;
        const LIVE = window.__LIVE || buildLive();
        const topics = (s.topicIds || [])
          .map((id) => LIVE.byId[id])
          .filter(Boolean)
          .map((t) => ({ ...t, curStatus: ensureTopicState(t.id).status }));
        if (!topics.length) {
          flashToast("⚠️ الجلسة دي مش مربوطة بمواضيع محددة");
          return;
        }

        const cfg = getGeminiConfig();
        if (!cfg.apiKey) {
          flashToast("⚠️ حط الـ Gemini API key الأول من ⚙️ Gemini AI فوق");
          toggleGeminiPanel(true);
          return;
        }

        s.aiState = "loading";
        s.aiError = "";
        render();

        const prompt = buildGeminiPrompt(
          topics,
          s.correct || 0,
          s.total || 0,
          s.notes || "",
          s.rawText || "",
          s.wrongNums || "",
          s.skippedNums || "",
        );
        const model = cfg.model || "gemini-3.6-flash";
        const url = `https://generativelanguage.googleapis.com/v1beta/models/${encodeURIComponent(model)}:generateContent`;
        const responseSchema = {
          type: "object",
          properties: {
            ratings: {
              type: "array",
              minItems: topics.length,
              maxItems: topics.length,
              items: {
                type: "object",
                properties: {
                  id: { type: "string", enum: topics.map((t) => t.id) },
                  status: {
                    type: "string",
                    enum: ["weak", "good", "mastered", "not_started"],
                  },
                  reason: { type: "string" },
                },
                required: ["id", "status", "reason"],
              },
            },
          },
          required: ["ratings"],
        };

        try {
          const resp = await fetch(url, {
            method: "POST",
            headers: {
              "Content-Type": "application/json",
              "x-goog-api-key": cfg.apiKey,
            },
            body: JSON.stringify({
              contents: [{ parts: [{ text: prompt }] }],
              generationConfig: {
                temperature: 0,
                responseMimeType: "application/json",
                responseSchema: responseSchema,
              },
            }),
          });

          if (resp.status === 429) {
            const retryAfterHeader = resp.headers.get("Retry-After");
            const waitSec = retryAfterHeader
              ? parseInt(retryAfterHeader, 10)
              : 60;
            s.aiState = "ratelimited";
            s.aiError = "الليميت بتاع Gemini خلص دلوقتي";
            render();
            scheduleAiRetry(sessionId, isNaN(waitSec) ? 60 : waitSec);
            return;
          }
          if (!resp.ok) {
            const errText = await resp.text().catch(() => "");
            s.aiState = "error";
            s.aiError =
              "خطأ من Gemini (كود " +
              resp.status +
              "). " +
              (errText ? errText.slice(0, 140) : "جرب تتأكد من الـ API key.");
            render();
            return;
          }
          const data = await resp.json();
          const textOut =
            (((data.candidates || [])[0] || {}).content || {}).parts?.[0]
              ?.text || "";
          // Try direct parse first (when responseMimeType:"application/json" is honoured),
          // fall back to regex-based extractJson for older cached responses.
          let parsed = null;
          try {
            parsed = textOut ? JSON.parse(textOut) : null;
          } catch (e) {
            parsed = extractJson(textOut);
          }
          if (!parsed || !Array.isArray(parsed.ratings)) {
            s.aiState = "error";
            s.aiError = "الرد من Gemini مكنش JSON صالح، جرب تاني.";
            render();
            return;
          }
          const requestedIds = new Set(topics.map((t) => t.id));
          const seen = new Set();
          const cleanRatings = [];
          parsed.ratings.forEach((r) => {
            if (!r || !requestedIds.has(r.id) || seen.has(r.id)) return;
            if (!["weak", "good", "mastered", "not_started"].includes(r.status))
              return;
            seen.add(r.id);
            cleanRatings.push(r);
          });
          const missingIds = topics
            .map((t) => t.id)
            .filter((id) => !seen.has(id));
          missingIds.forEach((id) => {
            const t = topics.find((x) => x.id === id);
            cleanRatings.push({
              id,
              status: (t && t.curStatus) || "not_started",
              reason:
                "الـ AI ماردش على الموضوع ده، اتسابت الحالة القديمة زي ما هي.",
            });
          });
          s.aiState = "done";
          s.aiError = missingIds.length
            ? `تنبيه: ${missingIds.length} موضوع مكنش في رد الـ AI، اتسابوا بحالتهم القديمة.`
            : "";
          s.aiAnalysis = { ratings: cleanRatings, analyzedAt: Date.now() };
          saveState(true);
          render();
        } catch (err) {
          s.aiState = "error";
          s.aiError =
            "فشل الاتصال بـ Gemini (ممكن مشكلة شبكة أو CORS). ممكن تستخدم التقييم اليدوي بدل كده.";
          render();
        }
      }

      function scheduleAiRetry(sessionId, waitSec) {
        clearAiRetry(sessionId);
        const deadline = Date.now() + waitSec * 1000;
        aiPendingRetry[sessionId] = { deadline };
        const tick = () => {
          const el = document.getElementById("aiCountdown-" + sessionId);
          const remaining = Math.max(
            0,
            Math.round((deadline - Date.now()) / 1000),
          );
          if (el) el.textContent = remaining + " ثانية";
          if (remaining <= 0) {
            clearInterval(aiPendingRetry[sessionId].intervalId);
            delete aiPendingRetry[sessionId];
            analyzeSessionWithGemini(sessionId);
          }
        };
        aiPendingRetry[sessionId].intervalId = setInterval(tick, 1000);
        tick();
      }
      function clearAiRetry(sessionId) {
        if (aiPendingRetry[sessionId]) {
          clearInterval(aiPendingRetry[sessionId].intervalId);
          delete aiPendingRetry[sessionId];
        }
      }

      function toggleGeminiPanel(forceOpen) {
        const panel = document.getElementById("geminiPanel");
        const shouldOpen =
          forceOpen !== undefined
            ? forceOpen
            : !panel.classList.contains("open");
        panel.classList.toggle("open", shouldOpen);
      }
      document
        .getElementById("geminiSettingsBtn")
        .addEventListener("click", () => toggleGeminiPanel());
      document
        .getElementById("geminiKeyToggle")
        .addEventListener("click", () => {
          const inp = document.getElementById("geminiKeyInput");
          const btn = document.getElementById("geminiKeyToggle");
          const showing = inp.type === "text";
          inp.type = showing ? "password" : "text";
          btn.textContent = showing ? "👁" : "🙈";
        });
      (function initGeminiInputs() {
        const cfg = getGeminiConfig();
        document.getElementById("geminiKeyInput").value = cfg.apiKey || "";
        document.getElementById("geminiModelInput").value =
          cfg.model || "gemini-3.6-flash";
        document.getElementById("geminiStatusText").textContent = cfg.apiKey
          ? "✅ فيه مفتاح متسجل"
          : "مفيش مفتاح لسه";
      })();
      document.getElementById("geminiSaveBtn").addEventListener("click", () => {
        const apiKey = document.getElementById("geminiKeyInput").value.trim();
        const model =
          document.getElementById("geminiModelInput").value.trim() ||
          "gemini-3.6-flash";
        saveGeminiConfig({ apiKey, model });
        document.getElementById("geminiStatusText").textContent = apiKey
          ? "✅ اتحفظ"
          : "مفيش مفتاح";
        flashToast("✔ اتحفظت إعدادات Gemini (محليًا بس)");
      });
      document
        .getElementById("geminiClearBtn")
        .addEventListener("click", () => {
          saveGeminiConfig({
            apiKey: "",
            model:
              document.getElementById("geminiModelInput").value.trim() ||
              "gemini-3.6-flash",
          });
          document.getElementById("geminiKeyInput").value = "";
          document.getElementById("geminiStatusText").textContent = "اتمسح";
          flashToast("🗑 اتمسح المفتاح");
        });
      document
        .getElementById("geminiTestBtn")
        .addEventListener("click", async () => {
          const apiKey = document.getElementById("geminiKeyInput").value.trim();
          const model =
            document.getElementById("geminiModelInput").value.trim() ||
            "gemini-3.6-flash";
          if (!apiKey) {
            flashToast("⚠️ اكتب المفتاح الأول");
            return;
          }
          const statusEl = document.getElementById("geminiStatusText");
          statusEl.textContent = "⏳ بيختبر الاتصال...";
          const url = `https://generativelanguage.googleapis.com/v1beta/models/${encodeURIComponent(model)}:generateContent`;
          try {
            const resp = await fetch(url, {
              method: "POST",
              headers: {
                "Content-Type": "application/json",
                "x-goog-api-key": apiKey,
              },
              body: JSON.stringify({
                contents: [
                  { parts: [{ text: "Reply with the single word: ok" }] },
                ],
              }),
            });
            if (resp.status === 429) {
              statusEl.textContent = "⏳ الاتصال شغال بس الليميت خلص دلوقتي";
              flashToast("الاتصال تمام، بس الليميت خلص مؤقتًا");
              return;
            }
            if (!resp.ok) {
              statusEl.textContent =
                "❌ رد بخطأ " + resp.status + " — تأكد من المفتاح/اسم الموديل";
              return;
            }
            await resp.json();
            statusEl.textContent = "✅ الاتصال شغال تمام!";
            flashToast("✅ Gemini شغال معاك");
          } catch (err) {
            statusEl.textContent =
              "❌ فشل الاتصال (شبكة أو CORS) — جرب تاني أو قولي";
            flashToast("⚠️ فشل الاتصال، شوف الرسالة تحت زرار الاختبار");
          }
        });

      /* =====================================================================
   INIT
===================================================================== */
      async function init() {
        document.getElementById("mainContainer").innerHTML =
          '<div class="empty-state">⏳ بنحمّل بياناتك...</div>';
        await loadState();
        render();
      }
      init();
    </script>
