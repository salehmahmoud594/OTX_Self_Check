<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>OTX Self-Check — لوحة مراجعة النقل الضوئي</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link
      href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700&family=Inter:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <style>
      :root {
        --bg: #0a0e17;
        --panel: #101827;
        --panel2: #141f36;
        --border: #232e4d;
        --border-soft: #1b2440;
        --text: #e9edf7;
        --muted: #8893ac;
        --muted-dim: #5c6785;
        --accent: #22d3c7;
        --accent-dim: rgba(34, 211, 199, 0.14);
        --accent-glow: rgba(34, 211, 199, 0.35);
        --not-started: #4b5670;
        --weak: #fb7565;
        --weak-dim: rgba(251, 117, 101, 0.16);
        --good: #f4b740;
        --good-dim: rgba(244, 183, 64, 0.16);
        --mastered: #39d98a;
        --mastered-dim: rgba(57, 217, 138, 0.16);
        --mono: "JetBrains Mono", ui-monospace, monospace;
        --sans: "Inter", system-ui, -apple-system, sans-serif;
      }
      * {
        box-sizing: border-box;
      }
      html {
        overflow-x: hidden;
        width: 100%;
      }
      body {
        margin: 0;
        background: var(--bg);
        color: var(--text);
        font-family: var(--sans);
        min-height: 100vh;
        padding-bottom: 120px;
        overflow-x: hidden;
        width: 100%;
      }
      .qb-card-top > div:first-child,
      .qb-session summary > div:first-child,
      .dash-card-top > div:first-child,
      .topic-title-row > div:first-child,
      .source-head-top > div:first-child,
      .overall-top > h3,
      .group-strip-top > span:first-child {
        min-width: 0;
      }
      ::selection {
        background: var(--accent-glow);
      }
      .storage-banner {
        background: rgba(244, 183, 64, 0.12);
        border-bottom: 1px solid rgba(244, 183, 64, 0.35);
        color: var(--good);
        font-size: 12px;
        text-align: center;
        padding: 8px 16px;
        font-family: var(--mono);
        display: none;
      }
      .storage-banner.show {
        display: block;
      }

      .topbar {
        position: sticky;
        top: 0;
        z-index: 30;
        background: linear-gradient(180deg, #0a0e17 80%, rgba(10, 14, 23, 0));
        padding: 22px 24px 14px;
        border-bottom: 1px solid var(--border-soft);
        backdrop-filter: blur(6px);
      }
      .topbar-inner {
        max-width: 1120px;
        margin: 0 auto;
      }
      .brand {
        display: flex;
        align-items: center;
        gap: 12px;
        margin-bottom: 14px;
      }
      .brand-mark {
        width: 34px;
        height: 34px;
        border-radius: 8px;
        background: radial-gradient(
          circle at 30% 30%,
          var(--accent),
          #0b7e76 75%
        );
        box-shadow: 0 0 18px var(--accent-glow);
        flex-shrink: 0;
        position: relative;
      }
      .brand-mark::after {
        content: "";
        position: absolute;
        inset: 8px;
        border-radius: 50%;
        background: rgba(10, 14, 23, 0.85);
      }
      h1 {
        font-family: var(--mono);
        font-size: 19px;
        font-weight: 700;
        margin: 0;
        letter-spacing: 0.3px;
      }
      .subtitle {
        color: var(--muted);
        font-size: 12.5px;
        margin-top: 2px;
        font-family: var(--mono);
      }
      .top-controls {
        display: flex;
        gap: 10px;
        flex-wrap: wrap;
        align-items: center;
      }
      .search-box {
        flex: 1;
        min-width: 220px;
        position: relative;
      }
      .search-box input {
        width: 100%;
        background: var(--panel);
        border: 1px solid var(--border);
        color: var(--text);
        padding: 9px 14px;
        border-radius: 8px;
        font-family: var(--sans);
        font-size: 13.5px;
        outline: none;
        transition: border-color 0.15s;
      }
      .search-box input:focus {
        border-color: var(--accent);
      }
      .search-box input::placeholder {
        color: var(--muted-dim);
      }
      .btn {
        background: var(--panel2);
        border: 1px solid var(--border);
        color: var(--text);
        padding: 9px 14px;
        border-radius: 8px;
        font-family: var(--sans);
        font-size: 13px;
        cursor: pointer;
        transition: all 0.15s;
        white-space: nowrap;
      }
      .btn:hover {
        border-color: var(--accent);
        color: var(--accent);
      }
      .btn.danger:hover {
        border-color: var(--weak);
        color: var(--weak);
      }
      .btn.primary {
        background: var(--accent);
        color: #062824;
        border-color: var(--accent);
        font-weight: 700;
      }
      .btn.primary:hover {
        color: #062824;
        opacity: 0.9;
      }
      .btn.small {
        padding: 6px 10px;
        font-size: 12px;
      }
      .icon-btn {
        background: none;
        border: none;
        cursor: pointer;
        font-size: 13px;
        color: var(--muted-dim);
        padding: 2px 4px;
        border-radius: 4px;
      }
      .icon-btn:hover {
        color: var(--accent);
        background: var(--accent-dim);
      }
      .icon-btn.danger-hover:hover {
        color: var(--weak);
        background: var(--weak-dim);
      }

      .tabs {
        max-width: 1120px;
        margin: 14px auto 0;
        display: flex;
        gap: 6px;
        flex-wrap: wrap;
      }
      .gemini-panel {
        max-width: 1120px;
        margin: 0 auto;
        max-height: 0;
        overflow: hidden;
        transition: max-height 0.2s ease;
      }
      .gemini-panel.open {
        max-height: 220px;
      }
      .gemini-panel-inner {
        background: var(--panel2);
        border: 1px solid var(--border);
        border-radius: 10px;
        padding: 14px 18px;
        margin: 0 24px 12px;
      }
      .gemini-panel-inner label {
        font-size: 10.5px;
        color: var(--muted);
        font-family: var(--mono);
        display: block;
        margin-bottom: 4px;
      }
      .gemini-panel-inner input {
        width: 100%;
        background: var(--bg);
        border: 1px solid var(--border-soft);
        color: var(--text);
        padding: 8px 10px;
        border-radius: 6px;
        font-size: 12.5px;
        font-family: var(--sans);
        outline: none;
        margin-bottom: 10px;
      }
      .ai-box {
        background: var(--panel2);
        border: 1px solid var(--border-soft);
        border-radius: 8px;
        padding: 10px 12px;
        margin-bottom: 10px;
      }
      .ai-rating-row {
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 10px;
        padding: 6px 0;
        border-top: 1px solid var(--border-soft);
        flex-wrap: wrap;
      }
      .ai-reason {
        color: var(--muted);
        font-size: 11px;
        margin-top: 2px;
      }
      .countdown-text {
        color: var(--good);
        font-family: var(--mono);
        font-size: 12px;
      }
      .tab {
        padding: 8px 16px;
        border-radius: 8px 8px 0 0;
        font-size: 13px;
        cursor: pointer;
        color: var(--muted);
        border: 1px solid transparent;
        border-bottom: none;
        font-family: var(--mono);
        transition: all 0.15s;
      }
      .tab:hover {
        color: var(--text);
      }
      .tab.active {
        background: var(--panel);
        color: var(--accent);
        border-color: var(--border);
        border-bottom: 2px solid var(--accent);
      }
      .tab-badge {
        background: var(--weak);
        color: #2a0500;
        font-size: 9.5px;
        font-weight: 700;
        border-radius: 10px;
        padding: 1px 6px;
        margin-inline-start: 5px;
      }

      .container {
        max-width: 1120px;
        margin: 0 auto;
        padding: 20px 24px;
      }
      .streak-badge {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        background: var(--panel2);
        border: 1px solid var(--border-soft);
        padding: 6px 14px;
        border-radius: 20px;
        font-family: var(--mono);
        font-size: 12.5px;
        margin-bottom: 16px;
      }
      .streak-badge b {
        color: var(--accent);
      }

      .dash-grid {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
        gap: 14px;
        margin-bottom: 22px;
      }
      .dash-card {
        background: var(--panel);
        border: 1px solid var(--border);
        border-radius: 12px;
        padding: 16px 18px;
        cursor: pointer;
        transition:
          border-color 0.15s,
          transform 0.15s;
      }
      .dash-card:hover {
        border-color: var(--accent);
        transform: translateY(-2px);
      }
      .dash-card-top {
        display: flex;
        justify-content: space-between;
        align-items: flex-start;
        margin-bottom: 10px;
      }
      .dash-card h3 {
        margin: 0;
        font-size: 14px;
        font-family: var(--mono);
        font-weight: 600;
      }
      .dash-pct {
        font-family: var(--mono);
        font-size: 22px;
        font-weight: 700;
        color: var(--accent);
      }
      .dash-sub {
        color: var(--muted);
        font-size: 11.5px;
        margin-top: 2px;
      }
      .led-strip {
        display: flex;
        flex-wrap: wrap;
        gap: 3px;
        margin-top: 12px;
      }
      .led {
        width: 9px;
        height: 9px;
        border-radius: 50%;
        background: var(--not-started);
        cursor: pointer;
        transition: transform 0.1s;
      }
      .led:hover {
        transform: scale(1.4);
      }
      .led.weak {
        background: var(--weak);
      }
      .led.good {
        background: var(--good);
      }
      .led.mastered {
        background: var(--mastered);
        box-shadow: 0 0 5px var(--mastered);
      }

      .overall-bar {
        background: var(--panel);
        border: 1px solid var(--border);
        border-radius: 12px;
        padding: 16px 18px;
        margin-bottom: 16px;
      }
      .overall-top {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 10px;
      }
      .overall-top h3 {
        margin: 0;
        font-family: var(--mono);
        font-size: 13.5px;
        color: var(--muted);
      }
      .bar-track {
        height: 8px;
        background: var(--border-soft);
        border-radius: 4px;
        overflow: hidden;
        display: flex;
      }
      .bar-seg {
        height: 100%;
      }

      details.focus-section {
        background: var(--panel);
        border: 1px solid var(--border);
        border-radius: 12px;
        margin-bottom: 16px;
        overflow: hidden;
      }
      details.focus-section summary {
        padding: 13px 18px;
        cursor: pointer;
        font-family: var(--mono);
        font-size: 13.5px;
        font-weight: 700;
        display: flex;
        justify-content: space-between;
        align-items: center;
        list-style: none;
      }
      details.focus-section summary::-webkit-details-marker {
        display: none;
      }
      details.focus-section summary::after {
        content: "▾";
        color: var(--muted);
        font-size: 11px;
        transition: transform 0.15s;
      }
      details.focus-section[open] summary::after {
        transform: rotate(180deg);
      }
      .focus-body {
        padding: 0 18px 14px;
      }

      .source-head {
        background: var(--panel);
        border: 1px solid var(--border);
        border-radius: 12px;
        padding: 16px 18px;
        margin-bottom: 16px;
      }
      .source-head-top {
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 12px;
        flex-wrap: wrap;
        margin-bottom: 10px;
      }
      .source-head h2 {
        margin: 0;
        font-family: var(--mono);
        font-size: 15px;
      }
      .file-tag {
        font-family: var(--mono);
        font-size: 11px;
        color: var(--accent);
        background: var(--accent-dim);
        padding: 3px 9px;
        border-radius: 6px;
        display: inline-block;
        margin-top: 4px;
      }
      .quick-actions {
        display: flex;
        gap: 8px;
        flex-wrap: wrap;
      }

      details.category {
        background: var(--panel);
        border: 1px solid var(--border);
        border-radius: 10px;
        margin-bottom: 10px;
        overflow: hidden;
      }
      details.category summary {
        padding: 12px 16px;
        cursor: pointer;
        font-family: var(--mono);
        font-size: 13px;
        font-weight: 600;
        display: flex;
        justify-content: space-between;
        align-items: center;
        list-style: none;
        color: var(--text);
      }
      details.category summary::-webkit-details-marker {
        display: none;
      }
      details.category summary::after {
        content: "▾";
        color: var(--muted);
        transition: transform 0.15s;
        font-size: 11px;
      }
      details.category[open] summary::after {
        transform: rotate(180deg);
      }
      .cat-count {
        color: var(--muted);
        font-size: 11px;
        font-weight: 400;
      }
      .cat-done-tag {
        color: var(--mastered);
        font-size: 10px;
        margin-inline-end: 8px;
      }

      .topic-row {
        display: flex;
        gap: 12px;
        align-items: flex-start;
        padding: 12px 16px;
        border-top: 1px solid var(--border-soft);
      }
      .topic-row.highlight {
        background: var(--accent-dim);
      }
      .topic-row input[type="checkbox"] {
        margin-top: 4px;
        width: 16px;
        height: 16px;
        accent-color: var(--accent);
        cursor: pointer;
        flex-shrink: 0;
      }
      .topic-main {
        flex: 1;
        min-width: 0;
      }
      .topic-title-row {
        display: flex;
        align-items: flex-start;
        justify-content: space-between;
        gap: 8px;
      }
      .topic-title {
        font-size: 13.5px;
        font-weight: 500;
        line-height: 1.4;
      }
      .topic-desc {
        color: var(--muted);
        font-size: 12px;
        margin-top: 3px;
        line-height: 1.5;
      }
      .row-tools {
        display: flex;
        gap: 2px;
        flex-shrink: 0;
      }
      .src-badge {
        font-family: var(--mono);
        font-size: 10px;
        color: var(--accent);
        background: var(--accent-dim);
        padding: 2px 7px;
        border-radius: 5px;
        margin-inline-end: 6px;
      }
      .custom-badge {
        font-family: var(--mono);
        font-size: 10px;
        color: var(--mastered);
        background: var(--mastered-dim);
        padding: 2px 7px;
        border-radius: 5px;
        margin-inline-end: 6px;
      }
      .overdue-badge {
        font-family: var(--mono);
        font-size: 10px;
        color: var(--weak);
        background: var(--weak-dim);
        padding: 2px 7px;
        border-radius: 5px;
        margin-inline-end: 6px;
      }
      .soon-badge {
        font-family: var(--mono);
        font-size: 10px;
        color: var(--good);
        background: var(--good-dim);
        padding: 2px 7px;
        border-radius: 5px;
        margin-inline-end: 6px;
      }
      .notes-input {
        width: 100%;
        background: var(--panel2);
        border: 1px solid var(--border-soft);
        color: var(--text);
        padding: 6px 10px;
        border-radius: 6px;
        font-size: 11.5px;
        margin-top: 7px;
        font-family: var(--sans);
        outline: none;
      }
      .notes-input:focus {
        border-color: var(--accent);
      }
      .notes-input::placeholder {
        color: var(--muted-dim);
      }
      .status-col {
        display: flex;
        flex-direction: column;
        gap: 5px;
        flex-shrink: 0;
        min-width: 104px;
      }
      .status-btn {
        font-family: var(--mono);
        font-size: 10.5px;
        padding: 5px 8px;
        border-radius: 6px;
        border: 1px solid var(--border);
        background: transparent;
        color: var(--muted);
        cursor: pointer;
        text-align: center;
        transition: all 0.12s;
      }
      .status-btn:hover {
        border-color: var(--muted);
      }
      .status-btn.sel-not_started.active {
        background: rgba(75, 86, 112, 0.25);
        border-color: var(--not-started);
        color: #b7bfd4;
      }
      .status-btn.sel-weak.active {
        background: var(--weak-dim);
        border-color: var(--weak);
        color: var(--weak);
      }
      .status-btn.sel-good.active {
        background: var(--good-dim);
        border-color: var(--good);
        color: var(--good);
      }
      .status-btn.sel-mastered.active {
        background: var(--mastered-dim);
        border-color: var(--mastered);
        color: var(--mastered);
      }
      .last-rev {
        color: var(--muted-dim);
        font-size: 9.5px;
        font-family: var(--mono);
        text-align: center;
        margin-top: 2px;
      }
      .topic-pct-row {
        display: flex;
        align-items: center;
        gap: 6px;
        margin-top: 3px;
      }
      .topic-pct-bar-wrap {
        flex: 1;
        height: 4px;
        background: var(--border);
        border-radius: 99px;
        overflow: hidden;
        min-width: 40px;
      }
      .topic-pct-bar {
        height: 100%;
        border-radius: 99px;
        transition: width 0.35s ease;
      }
      .topic-pct-bar.not_started {
        background: var(--not-started);
      }
      .topic-pct-bar.weak {
        background: var(--weak);
      }
      .topic-pct-bar.good {
        background: var(--good);
      }
      .topic-pct-bar.mastered {
        background: var(--mastered);
      }
      .topic-pct-label {
        font-family: var(--mono);
        font-size: 9.5px;
        font-weight: 600;
        min-width: 30px;
        text-align: right;
        white-space: nowrap;
      }
      .topic-pct-label.not_started {
        color: var(--not-started);
      }
      .topic-pct-label.weak {
        color: var(--weak);
      }
      .topic-pct-label.good {
        color: var(--good);
      }
      .topic-pct-label.mastered {
        color: var(--mastered);
      }

      .edit-form input[type="text"],
      .edit-form textarea {
        width: 100%;
        background: var(--panel2);
        border: 1px solid var(--accent);
        color: var(--text);
        padding: 7px 10px;
        border-radius: 6px;
        font-size: 12.5px;
        font-family: var(--sans);
        outline: none;
        margin-bottom: 6px;
      }
      .edit-form textarea {
        min-height: 44px;
        resize: vertical;
      }
      .edit-form-actions {
        display: flex;
        gap: 8px;
      }
      .add-row {
        padding: 10px 16px;
        border-top: 1px solid var(--border-soft);
      }
      .add-form {
        background: var(--panel2);
        border: 1px dashed var(--border);
        border-radius: 8px;
        padding: 12px;
        margin: 8px 16px;
      }
      .add-form input[type="text"],
      .add-form textarea,
      .add-form select {
        width: 100%;
        background: var(--bg);
        border: 1px solid var(--border-soft);
        color: var(--text);
        padding: 7px 10px;
        border-radius: 6px;
        font-size: 12.5px;
        font-family: var(--sans);
        outline: none;
        margin-bottom: 8px;
      }
      .add-form label {
        font-size: 10.5px;
        color: var(--muted);
        font-family: var(--mono);
        display: block;
        margin-bottom: 3px;
      }

      .priority-section {
        margin-bottom: 16px;
      }
      .priority-section-title {
        font-family: var(--mono);
        font-size: 12.5px;
        font-weight: 700;
        margin-bottom: 8px;
        padding: 0 2px;
      }

      .qlog-summary {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
        gap: 12px;
        margin-bottom: 18px;
      }
      .qlog-sum-card {
        background: var(--panel);
        border: 1px solid var(--border);
        border-radius: 10px;
        padding: 12px 14px;
      }
      .qlog-sum-card h4 {
        margin: 0 0 4px;
        font-family: var(--mono);
        font-size: 12px;
        color: var(--muted);
      }
      .qlog-sum-card .val {
        font-family: var(--mono);
        font-size: 20px;
        font-weight: 700;
        color: var(--accent);
      }
      .session-card {
        background: var(--panel);
        border: 1px solid var(--border);
        border-radius: 10px;
        margin-bottom: 12px;
        overflow: hidden;
      }
      .session-card.draft {
        border-color: var(--accent);
        box-shadow: 0 0 0 1px var(--accent-glow);
      }
      .session-summary {
        padding: 13px 16px;
        cursor: pointer;
        list-style: none;
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 10px;
      }
      .session-summary::-webkit-details-marker {
        display: none;
      }
      .session-summary::after {
        content: "▾";
        color: var(--muted);
        font-size: 11px;
        transition: transform 0.15s;
        flex-shrink: 0;
      }
      details.session-card[open] .session-summary::after {
        transform: rotate(180deg);
      }
      .session-summary-main {
        display: flex;
        align-items: center;
        gap: 7px;
        flex-wrap: wrap;
        min-width: 0;
        flex: 1;
      }
      .session-summary-date {
        font-family: var(--mono);
        font-size: 12px;

        color: var(--accent);

        border-radius: 6px;

        margin-top: 14px;
      }
      .combined-top {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 8px;
      }
      .prompt-text {
        background: var(--bg);
        border: 1px solid var(--border-soft);
        border-radius: 8px;
        padding: 12px;
        font-family: var(--sans);
        font-size: 13px;
        line-height: 1.7;
        color: var(--text);
        white-space: pre-wrap;
        min-height: 44px;
      }

      .qb-search {
        width: 100%;
        background: var(--panel);
        border: 1px solid var(--border);
        color: var(--text);
        padding: 10px 14px;
        border-radius: 8px;
        font-family: var(--sans);
        font-size: 13.5px;
        outline: none;
        margin-bottom: 14px;

        border-color: var(--accent);

        gap: 8px;

        display: none;
      }

        content: "▾";

        font-size: 11px;
        transition: transform 0.15s;
      }
      details.qb-session[open] summary::after {
        transform: rotate(180deg);

      .qb-session-title {
        font-family: var(--mono);
        font-size: 13.5px;
        font-weight: 700;
      }
      .qb-session-sub {
        color: var(--muted);
        font-size: 11.5px;
        margin-top: 2px;
        font-family: var(--mono);

        padding: 0 18px 16px;
      }
      .qb-card {
        background: var(--panel2);

        padding: 14px 16px;
        margin-bottom: 10px;

        align-items: flex-start;

        margin-bottom: 8px;

        font-size: 13.5px;
        font-weight: 600;
        line-height: 1.5;

      .qb-qnum {
        font-family: var(--mono);
        font-size: 10.5px;
        color: var(--accent);
        margin-bottom: 3px;
      }
      .qb-badge {
        font-family: var(--mono);

        font-weight: 700;
        border-radius: 20px;

        flex-shrink: 0;
      }
      .qb-badge.correct {
        background: var(--mastered-dim);
        color: var(--mastered);
        border: 1px solid var(--mastered);
      }
      .qb-badge.wrong {
        background: var(--weak-dim);
        color: var(--weak);
        border: 1px solid var(--weak);
      }
      .qb-badge.skipped {
        background: var(--good-dim);
        color: var(--good);
        border: 1px solid var(--good);
      }
      .qb-badge.unknown {
        background: rgba(75, 86, 112, 0.25);
        color: #b7bfd4;
        border: 1px solid var(--not-started);
      }
      .qb-choice {
        padding: 7px 12px;
        border-radius: 8px;
        background: var(--bg);
        border: 1px solid var(--border-soft);

        margin-bottom: 5px;

        background: var(--mastered-dim);
        border-color: var(--mastered);
        color: var(--mastered);

        color: var(--muted-dim);
        font-size: 11.5px;
        font-style: italic;
        margin-top: 8px;

        color: var(--mastered);
      }
      .qb-status-btn.active-wrong {
        background: var(--weak-dim);
        border-color: var(--weak);
        color: var(--weak);
      }
      .qb-status-btn.active-skipped {
        background: var(--good-dim);
        border-color: var(--good);
        color: var(--good);

        border-radius: 20px;
        border: 1px solid var(--border);
        background: var(--panel);
        color: var(--muted);

        display: flex;
        align-items: center;
        gap: 6px;
        transition: all 0.12s;
      }
      .qb-filter-btn:hover {
        border-color: var(--muted);
      }
      .qb-filter-count {
        font-size: 10.5px;
        opacity: 0.75;
      }
      .qb-filter-btn.active-all {
        background: var(--accent-dim);
        border-color: var(--accent);
        color: var(--accent);
      }
      .qb-filter-btn.active-wrong {
        background: var(--weak-dim);
        border-color: var(--weak);
        color: var(--weak);
      }
      .qb-filter-btn.active-skipped {
        background: var(--good-dim);
        border-color: var(--good);
        color: var(--good);
      }
      .qb-filter-btn.active-correct {
        background: var(--mastered-dim);
        border-color: var(--mastered);
        color: var(--mastered);
      }
      .qb-filter-btn.active-src {
        background: var(--accent-dim);
        border-color: var(--accent);
        color: var(--accent);
      }
      .qlog-controls-row {
        display: flex;
        gap: 10px;
        align-items: center;
        flex-wrap: wrap;
        margin-bottom: 16px;
      }
      .qlog-sort-select {
        background: var(--panel);
        border: 1px solid var(--border);
        color: var(--text);
        padding: 7px 12px;
        border-radius: 20px;
        font-family: var(--mono);
        font-size: 12px;
        outline: none;
        cursor: pointer;
      }
      .qlog-sort-select:focus {
        border-color: var(--accent);
      }
      .num-fields-row {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 12px;
        margin-top: 2px;
      }
      .num-field {
        width: 100%;
        background: var(--bg);
        border: 1px solid var(--border);
        color: var(--text);
        padding: 8px 12px;
        border-radius: 8px;
        font-family: var(--mono);
        font-size: 12.5px;
        outline: none;
        box-sizing: border-box;
      }
      .num-field:focus {
        border-color: var(--accent);
      }
      @media (max-width: 520px) {
        .num-fields-row {
          grid-template-columns: 1fr;
        }
      }

      .toast {
        position: fixed;
        bottom: 130px;
        left: 50%;
        transform: translateX(-50%) translateY(20px);
        background: var(--accent);
        color: #062824;
        padding: 8px 18px;
        border-radius: 20px;
        font-size: 12.5px;
        font-family: var(--mono);
        font-weight: 600;
        opacity: 0;
        transition: all 0.25s;
        z-index: 60;
        pointer-events: none;
      }
      .toast.show {
        opacity: 1;
        transform: translateX(-50%) translateY(0);
      }
      .confirm-overlay {
        position: fixed;
        inset: 0;
        background: rgba(4, 6, 12, 0.72);
        display: none;
        align-items: center;
        justify-content: center;
        z-index: 100;
        padding: 20px;
      }
      .confirm-overlay.show {
        display: flex;
      }
      .confirm-box {
        background: var(--panel);
        border: 1px solid var(--border);
        border-radius: 12px;
        padding: 22px 24px;
        max-width: 360px;
        width: 100%;
        box-shadow: 0 12px 40px rgba(0, 0, 0, 0.5);
      }
      .confirm-message {
        font-size: 13.5px;
        line-height: 1.6;
        margin-bottom: 16px;
        text-align: center;
      }
      .empty-state {
        color: var(--muted);
        font-size: 13px;
        text-align: center;
        padding: 24px 0;
      }
      .footer-note {
        color: var(--muted-dim);
        font-size: 11px;
        text-align: center;
        margin: 24px 0 8px;
        font-family: var(--mono);
      }

      @media (max-width: 768px) {
        .topbar {
          padding: 16px 14px 10px;
        }
        .container {
          padding: 14px 14px 10px;
        }
        .gemini-panel-inner {
          margin: 0 14px 12px;
          padding: 12px 14px;
        }
        h1 {
          font-size: 16.5px;
        }
        .subtitle {
          font-size: 11px;
        }
        .brand-mark {
          width: 28px;
          height: 28px;
        }
        .top-controls {
          gap: 8px;
        }
        .search-box {
          min-width: 100%;
          order: -1;
        }
        .btn.small {
          padding: 7px 11px;
          font-size: 12px;
        }

        .tabs {
          flex-wrap: nowrap;
          overflow-x: auto;
          overflow-y: hidden;
          -webkit-overflow-scrolling: touch;
          scrollbar-width: none;
          padding-bottom: 2px;
          margin-inline: -14px;
          padding-inline: 14px;
        }
        .tabs::-webkit-scrollbar {
          display: none;
        }
        .tab {
          white-space: nowrap;
          flex-shrink: 0;
          padding: 8px 13px;
          font-size: 12.5px;
        }

        .quiz-bar-handle {
          padding: 12px 14px;

        .quiz-bar-handle span[style*="font-size:11px"] {
          display: none;
        }
        .quiz-body {
          padding: 0 14px 16px;
        }

        .dash-card {
          padding: 14px 15px;
        }
        .qb-card {
          padding: 12px 13px;
        }
        .qb-filter-row {
          gap: 6px;
        }
        .qb-filter-btn {
          padding: 6px 11px;
          font-size: 11.5px;
        }

      @media (max-width: 640px) {
        .topic-row {
          flex-wrap: wrap;
        }
        .status-col {
          flex-direction: row;
          flex-wrap: wrap;
          min-width: 0;
          width: 100%;
        }
        .status-btn {
          flex: 1;
        }
      }

      @media (max-width: 420px) {
        h1 {
          font-size: 15px;
        }
        .topbar {
          padding: 14px 12px 8px;
        }
        .container {
          padding: 12px 12px 8px;
        }
        .tabs {
          margin-inline: -12px;
          padding-inline: 12px;
        }
        .btn.small {
          padding: 6px 9px;
          font-size: 11.5px;
        }
        .qb-status-row,
        .status-col {
          gap: 4px;
        }
        .qb-status-btn {
          padding: 4px 8px;
          font-size: 9.5px;
        }
        .qlog-summary,
        .dash-grid {
          grid-template-columns: 1fr;
        }
        .num-fields-row {
          grid-template-columns: 1fr;
        }
      }
    </style>
  </head>
  <body>
    <div class="storage-banner" id="storageBanner"></div>

    <div class="topbar">
      <div class="topbar-inner">

          />

      </div>

      </div>

      <div class="quiz-body" id="quizBody"></div>
    </div>

       * currently "mastered" but has a middling historical average will show

      function pctToStatusClass(pct) {

      /* =====================================================================
   STORAGE — localStorage (primary) + IndexedDB (redundant backup)
   Cookies were considered but dropped: a single cookie caps at ~4KB and
   this dataset (150+ topics + notes + a growing session log) blows past
   that fast, so cookies would silently truncate data. IndexedDB has no
   such practical limit and is the correct "second layer" here.
===================================================================== */
      const STORAGE_KEY = "otx_selfcheck_v3";
      const IDB_NAME = "otx_selfcheck_idb";
      const IDB_STORE = "kv";
      let memoryFallback = {};
      let lsAvailable = false;

      function testLocalStorage() {
        try {
          localStorage.setItem("__t__", "1");
          localStorage.removeItem("__t__");
          lsAvailable = true;
        } catch (e) {
          lsAvailable = false;
        }
      }
      function idbOpen() {
        return new Promise((resolve, reject) => {
          if (!("indexedDB" in window)) {
            reject("no-idb");
            return;
          }
          const req = indexedDB.open(IDB_NAME, 1);
          req.onupgradeneeded = () => {
            req.result.createObjectStore(IDB_STORE);
          };
          req.onsuccess = () => resolve(req.result);
          req.onerror = () => reject(req.error);
        });
      }
      async function idbGet(key) {
        try {
          const db = await idbOpen();
          return await new Promise((resolve, reject) => {
            const tx = db.transaction(IDB_STORE, "readonly");
            const req = tx.objectStore(IDB_STORE).get(key);
            req.onsuccess = () =>
              resolve(req.result === undefined ? null : req.result);
            req.onerror = () => reject(req.error);
          });
        } catch (e) {
          return null;
        }
      }
      async function idbSet(key, val) {
        try {
          const db = await idbOpen();
          return await new Promise((resolve, reject) => {
            const tx = db.transaction(IDB_STORE, "readwrite");
            tx.objectStore(IDB_STORE).put(val, key);
            tx.oncomplete = () => resolve(true);
            tx.onerror = () => reject(tx.error);
          });
        } catch (e) {
          idbAvailable = false;
          return false;
        }
      }

        try {
          const raw = await idbGet(STORAGE_KEY);
          if (raw) idbParsed = JSON.parse(raw);
        } catch (e) {
          idbAvailable = false;
        }

        const stored = lsParsed || idbParsed || null;
        if (stored) {
          appState = Object.assign(base, {
            topics: Object.assign(base.topics, stored.topics || {}),
            sessions: stored.sessions || [],
            customTopics: stored.customTopics || base.customTopics,
            topicOverrides: stored.topicOverrides || {},
            deletedIds: stored.deletedIds || [],
            reviewedToday: stored.reviewedToday || { date: "", ids: [] },
          });
          // sync: if localStorage had nothing but IDB did, write back to localStorage
          if (!lsParsed && idbParsed && lsAvailable) {
            try {
              localStorage.setItem(STORAGE_KEY, JSON.stringify(appState));
            } catch (e) {}
          }

      /* Safety net for mobile: text fields (quiz paste, notes, wrong/skip numbers)
   only commit to appState on the 'change' event, which fires on blur — if the
   user pastes a huge quiz and then switches apps / locks the phone / closes
   the tab WITHOUT tapping elsewhere first, that change/save never fires and
   the paste is silently lost even though storage itself works fine. This
   flushes synchronously the moment the page is about to be hidden: it blurs
   whatever's focused (forcing its pending 'change' to commit into appState
   right now, not 250ms from now) then writes straight to localStorage,
   skipping the debounce entirely so it can't be cut off mid-timer. */
      function flushSaveNow() {
        try {
          if (
            document.activeElement &&
            document.activeElement !== document.body &&
            typeof document.activeElement.blur === "function"
          ) {
            document.activeElement.blur();
          }
        } catch (e) {}
        clearTimeout(saveTimer);
        try {
          const json = JSON.stringify(appState);
          if (lsAvailable) {
            try {
              localStorage.setItem(STORAGE_KEY, json);
            } catch (e) {}
          } else {
            memoryFallback[STORAGE_KEY] = json;
          }
          idbSet(STORAGE_KEY, json); // best-effort, not awaited — page may already be gone by the time it resolves
        } catch (e) {}
      }
      document.addEventListener("visibilitychange", () => {
        if (document.hidden) flushSaveNow();
      });
      window.addEventListener("pagehide", flushSaveNow);
      window.addEventListener("blur", flushSaveNow);

      function buildLive() {
        const bySrc = {};
        Object.keys(DATA).forEach((src) => {
          const base = DATA[src]
            .filter((t) => appState.deletedIds.indexOf(t.id) === -1)
            .map((t) => {
              const ov = appState.topicOverrides[t.id];
              return ov
                ? Object.assign({}, t, {
                    topic: ov.topic !== undefined ? ov.topic : t.topic,
                    desc: ov.desc !== undefined ? ov.desc : t.desc,
                  })
                : t;
            });
          const custom = (appState.customTopics[src] || [])
            .filter((t) => appState.deletedIds.indexOf(t.id) === -1)
            .map((t) => Object.assign({ custom: true, src }, t));
          bySrc[src] = base.concat(custom);
        });
        const all = Object.values(bySrc).flat();
        const byId = {};
        all.forEach((t) => (byId[t.id] = t));
        return { bySrc, all, byId };
      }
      function ensureTopicState(id) {
        if (!appState.topics[id])
          appState.topics[id] = {
            status: "not_started",
            note: "",
            lastReviewed: "",
          };
        return appState.topics[id];
      }

      /**
       * Compute mastery percentage for a topic.
       * Uses all sessions that covered this topic and had an AI analysis.
       * Score per session: mastered=100, good=67, weak=33, not_started/missing=0.
       * Falls back to STATUS_PCT[currentStatus] if no session history.
       */
      function topicMasteryPct(topicId) {
        const sessions = (appState.sessions || []).filter(
          (s) =>
            Array.isArray(s.topicIds) &&
            s.topicIds.includes(topicId) &&
            s.aiAnalysis &&
            Array.isArray(s.aiAnalysis.ratings),
        );
        if (!sessions.length) {
          const st = ensureTopicState(topicId);
          return STATUS_PCT[st.status] ?? 0;
        }
        const scores = sessions
          .map((s) => {
            const r = s.aiAnalysis.ratings.find((x) => x.id === topicId);
            return r ? (STATUS_PCT[r.status] ?? 0) : null;
          })
          .filter((v) => v !== null);
        if (!scores.length) {
          const st = ensureTopicState(topicId);
          return STATUS_PCT[st.status] ?? 0;
        }
        return Math.round(scores.reduce((a, b) => a + b, 0) / scores.length);
      }

            activeTab = el.dataset.tab;
            searchQuery = "";
            editingId = null;
            activeAddForm = null;
            document.getElementById("searchInput").value = "";
            render();
          });
        });
      }

      /* =====================================================================
   RENDER MAIN
===================================================================== */
      function computeStats(topics) {
        const total = topics.length;
        const counts = { not_started: 0, weak: 0, good: 0, mastered: 0 };
        topics.forEach((t) => counts[ensureTopicState(t.id).status]++);
        const pct = total
          ? Math.round(((counts.good + counts.mastered) / total) * 100)
          : 0;
        return { total, counts, pct };
      }
      function barTrack(counts, total) {
        if (!total) return '<div class="bar-track"></div>';
        const segs = [
          ["mastered", counts.mastered, "var(--mastered)"],
          ["good", counts.good, "var(--good)"],
          ["weak", counts.weak, "var(--weak)"],
          ["not_started", counts.not_started, "var(--not-started)"],
        ];
        return `<div class="bar-track">${segs.map(([k, v, c]) => (v ? `<div class="bar-seg" style="width:${(v / total) * 100}%; background:${c}"></div>` : "")).join("")}</div>`;
      }

      function reviewDueList(LIVE) {
        const list = LIVE.all
          .filter((t) => {
            const st = ensureTopicState(t.id);
            if (st.status === "not_started" || !st.lastReviewed) return false;
            return daysSince(st.lastReviewed) >= REVIEW_SOON_DAYS;
          })
          .sort(
            (a, b) =>
              daysSince(ensureTopicState(b.id).lastReviewed) -
              daysSince(ensureTopicState(a.id).lastReviewed),
          );
        return {
          overdue: list.filter(
            (t) =>
              daysSince(ensureTopicState(t.id).lastReviewed) >=
              REVIEW_OVERDUE_DAYS,
          ),
          soon: list.filter(
            (t) =>
              daysSince(ensureTopicState(t.id).lastReviewed) <
              REVIEW_OVERDUE_DAYS,
          ),
        };
      }

      function render() {
        const LIVE = buildLive();
        window.__LIVE = LIVE;
        renderTabs(LIVE);
        const container = document.getElementById("mainContainer");
        if (searchQuery.trim()) {
          container.innerHTML = renderSearchResults(LIVE, searchQuery.trim());
        } else if (activeTab === "dashboard") {
          container.innerHTML = renderDashboard(LIVE);
        } else if (activeTab === "quizlog") {
          container.innerHTML = renderQuizLog(LIVE);
        } else if (activeTab === "questionbank") {
          container.innerHTML = renderQuestionBank(LIVE);
        } else {
          container.innerHTML = renderSourceTab(LIVE, activeTab);
        }
        attachRowListeners(LIVE);
        attachDashboardListeners(LIVE);
        attachAddFormListeners(LIVE);
        attachCollapseListeners();
        attachQuizLogListeners(LIVE);
        attachQuestionBankListeners();
        renderQuizBuilder(LIVE);
      }

      function renderDashboard(LIVE) {
        const overall = computeStats(LIVE.all);
        const todayCount =
          appState.reviewedToday.date === todayStr()
            ? appState.reviewedToday.ids.length
            : 0;
        let html = `<div class="streak-badge">🔥 راجعت النهاردة: <b>${todayCount}</b> موضوع</div>`;
        html += `<div class="overall-bar"><div class="overall-top"><h3>OVERALL PROGRESS — ${LIVE.all.length} sub-topic</h3><span style="font-family:var(--mono); color:var(--accent); font-weight:700;">${overall.pct}%</span></div>${barTrack(overall.counts, overall.total)}</div>`;

        const due = reviewDueList(LIVE);
        html += `<details class="focus-section" ${due.overdue.length ? "open" : ""}><summary>🔁 محتاج مراجعة <span class="cat-count">${due.overdue.length + due.soon.length}</span></summary><div class="focus-body">`;
        if (!due.overdue.length && !due.soon.length) {
          html += `<div class="empty-state">✅ مفيش حاجة محتاجة مراجعة دلوقتي.</div>`;
        } else {
          if (due.overdue.length) {
            html += `<div class="priority-section"><div class="priority-section-title" style="color:var(--weak)">🔴 متأخر (14+ يوم) — ${due.overdue.length}</div>`;
            due.overdue.forEach(
              (t) =>
                (html += renderRow(
                  t,
                  true,
                  daysSince(ensureTopicState(t.id).lastReviewed),
                )),
            );
            html += `</div>`;
          }
          if (due.soon.length) {
            html += `<div class="priority-section"><div class="priority-section-title" style="color:var(--good)">🟡 قريب (7-13 يوم) — ${due.soon.length}</div>`;
            due.soon.forEach(
              (t) =>
                (html += renderRow(
                  t,
                  true,
                  daysSince(ensureTopicState(t.id).lastReviewed),
                )),
            );
            html += `</div>`;
          }
        }
        html += `</div></details>`;

        const weakList = LIVE.all.filter(
          (t) => ensureTopicState(t.id).status === "weak",
        );
        const coreNotStarted = LIVE.all.filter(
          (t) =>
            ensureTopicState(t.id).status === "not_started" &&
            SOURCE_META[t.src].core,
        );
        const appliedNotStarted = LIVE.all.filter(
          (t) =>
            ensureTopicState(t.id).status === "not_started" &&
            !SOURCE_META[t.src].core,
        );
        const prioCount =
          weakList.length + coreNotStarted.length + appliedNotStarted.length;
        html += `<details class="focus-section"><summary>📋 ذاكر ده بعدين <span class="cat-count">${prioCount}</span></summary><div class="focus-body">`;
        html += `<div class="priority-section"><div class="priority-section-title" style="color:var(--weak)">🔴 أولوية 1 — Weak (${weakList.length})</div>${weakList.length ? weakList.map((t) => renderRow(t, true)).join("") : '<div class="empty-state">مفيش حاجة Weak 👍</div>'}</div>`;
        html += `<div class="priority-section"><div class="priority-section-title" style="color:var(--good)">🟠 أولوية 2 — أساسيات HCIA/HCIP لسه (${coreNotStarted.length})</div>${coreNotStarted.length ? coreNotStarted.map((t) => renderRow(t, true)).join("") : '<div class="empty-state">خلصت الأساسيات 👍</div>'}</div>`;
        html += `<div class="priority-section"><div class="priority-section-title" style="color:var(--accent)">🔵 أولوية 3 — تطبيقي لسه (${appliedNotStarted.length})</div>${appliedNotStarted.length ? appliedNotStarted.map((t) => renderRow(t, true)).join("") : '<div class="empty-state">خلصت التطبيقي كمان 👍</div>'}</div>`;
        html += `</div></details>`;

        html += '<div class="dash-grid">';
        Object.keys(SOURCE_META).forEach((src) => {
          const topics = LIVE.bySrc[src];
          const stats = computeStats(topics);
          html += `<div class="dash-card" data-goto="${src}">
      <div class="dash-card-top"><div><h3>${SOURCE_META[src].label}</h3><div class="dash-sub">${stats.total} sub-topics</div></div><div class="dash-pct">${stats.pct}%</div></div>
      ${barTrack(stats.counts, stats.total)}
      <div class="led-strip">${topics.map((t) => `<div class="led ${ensureTopicState(t.id).status !== "not_started" ? ensureTopicState(t.id).status : ""}" title="${escapeHtml(t.topic)}" data-goto-topic="${t.id}"></div>`).join("")}</div>
    </div>`;
        });
        html += "</div>";
        html += `<div class="footer-note">بياناتك بتتحفظ تلقائيًا وخاصة بيك بس.</div>`;
        return html;
      }

      function renderSourceTab(LIVE, src) {
        const meta = SOURCE_META[src];
        const topics = LIVE.bySrc[src];
        const stats = computeStats(topics);
        let html = `<div class="source-head">
    <div class="source-head-top"><div><h2>${meta.label}</h2><span class="file-tag">📄 ${escapeHtml(meta.file)}</span></div><div class="dash-pct" style="font-size:18px">${stats.pct}%</div></div>
    ${barTrack(stats.counts, stats.total)}
    <div class="led-strip" style="margin-top:12px">${topics.map((t) => `<div class="led ${ensureTopicState(t.id).status !== "not_started" ? ensureTopicState(t.id).status : ""}" title="${escapeHtml(t.topic)}" data-goto-topic="${t.id}"></div>`).join("")}</div>
    <div class="quick-actions" style="margin-top:12px">
      <button class="btn small" data-quick="weak" data-src="${src}">☑ حدد كل الـ Weak</button>
      <button class="btn small" data-quick="not_started" data-src="${src}">☑ حدد كل الـ Not Started</button>
      <button class="btn small" data-quick="clear" data-src="${src}">✕ إلغاء التحديد</button>
      <button class="btn small" data-expand-all="${src}">📂 افتح الكل</button>
      <button class="btn small" data-collapse-all="${src}">📁 اقفل الكل</button>
      <button class="btn small" data-new-cat="${src}">+ قسم جديد بالكامل</button>
    </div>
  </div>`;

        if (
          activeAddForm &&
          activeAddForm.src === src &&
          activeAddForm.newCat
        ) {
          html += renderAddForm(src, null);
        }

        const cats = [...new Set(topics.map((t) => t.cat))];
        cats.forEach((cat) => {
          const catTopics = topics.filter((t) => t.cat === cat);
          const allDone =
            catTopics.length > 0 &&
            catTopics.every((t) => {
              const s = ensureTopicState(t.id).status;
              return s === "good" || s === "mastered";
            });
          html += `<details class="category" ${allDone ? "" : "open"}><summary>${escapeHtml(cat)} <span>${allDone ? '<span class=\"cat-done-tag\">✓ خلصان</span>' : ""}<span class="cat-count">${catTopics.length}</span></span></summary>`;
          catTopics.forEach((t) => (html += renderRow(t)));
          html += `<div class="add-row"><button class="btn small" data-add-topic-src="${src}" data-add-topic-cat="${escapeAttr(cat)}">+ أضف موضوع في القسم ده</button></div>`;
          if (
            activeAddForm &&
            activeAddForm.src === src &&
            activeAddForm.cat === cat
          ) {
            html += renderAddForm(src, cat);
          }
          html += `</details>`;
        });
        return html;
      }

      function renderAddForm(src, cat) {
        const isNewCat = cat === null;
        return `<div class="add-form" data-add-form="${src}::${isNewCat ? "__new__" : cat}">
    ${isNewCat ? `<label>اسم القسم الجديد</label><input type="text" class="af-cat" placeholder="مثال: Advanced OTN Deep Dive">` : ""}
    <label>اسم الموضوع</label><input type="text" class="af-topic" placeholder="اسم الموضوع (English يفضل)">
    <label>وصف مختصر (اختياري)</label><textarea class="af-desc" placeholder="ملاحظة قصيرة بالعربي"></textarea>
    <div class="edit-form-actions">
      <button class="btn small primary" data-save-add="${src}" data-cat="${isNewCat ? "" : escapeAttr(cat)}">✔ إضافة</button>
      <button class="btn small" data-cancel-add="1">إلغاء</button>
    </div>
  </div>`;
      }

      function renderSearchResults(LIVE, q) {
        const ql = q.toLowerCase();
        const matches = LIVE.all.filter(
          (t) =>
            t.topic.toLowerCase().includes(ql) ||
            t.desc.includes(q) ||
            t.cat.toLowerCase().includes(ql),
        );
        if (!matches.length)
          return `<div class="empty-state">مفيش نتائج لـ "${escapeHtml(q)}"</div>`;
        let html = `<div class="source-head"><h2>🔎 نتائج البحث عن: ${escapeHtml(q)}</h2><div class="dash-sub" style="margin-top:6px">${matches.length} موضوع</div></div>`;
        html += `<details class="category" open><summary>Results <span class="cat-count">${matches.length}</span></summary>`;
        matches.forEach((t) => (html += renderRow(t, true)));
        html += `</details>`;
        return html;
      }

      function renderRow(t, showSrcBadge, overdueDays) {
        const st = ensureTopicState(t.id);
        const isSel = selected.has(t.id);
        const pct = topicMasteryPct(t.id);
        const pctClass = pctToStatusClass(pct);

        if (editingId === t.id) {
          return `<div class="topic-row" id="row-${t.id}">
      <div class="topic-main edit-form">
        <input type="text" class="ef-topic" value="${escapeAttr(t.topic)}">
        <textarea class="ef-desc">${escapeHtml(t.desc)}</textarea>
        <div class="edit-form-actions">
          <button class="btn small primary" data-save-edit="${t.id}">✔ حفظ</button>
          <button class="btn small" data-cancel-edit="1">إلغاء</button>
        </div>
      </div>
    </div>`;
        }

        let badges = showSrcBadge
          ? `<span class="src-badge">${SOURCE_META[t.src].short}</span>`
          : "";
        if (t.custom) badges += `<span class="custom-badge">مخصص</span>`;
        if (overdueDays !== undefined) {
          badges +=
            overdueDays >= REVIEW_OVERDUE_DAYS
              ? `<span class="overdue-badge">قبل ${overdueDays} يوم</span>`
              : `<span class="soon-badge">قبل ${overdueDays} يوم</span>`;
        }

        return `<div class="topic-row" id="row-${t.id}">
    <input type="checkbox" class="select-box" data-id="${t.id}" ${isSel ? "checked" : ""}>
    <div class="topic-main">
      <div class="topic-title-row">
        <div class="topic-title">${badges}${escapeHtml(t.topic)}</div>
        <div class="row-tools">
          <button class="icon-btn" data-edit="${t.id}" title="تعديل">✏️</button>
          <button class="icon-btn danger-hover" data-delete="${t.id}" title="حذف">🗑</button>
        </div>
      </div>
      <div class="topic-desc">${escapeHtml(t.desc)}</div>
      <input class="notes-input" data-id="${t.id}" placeholder="ملاحظات..." value="${escapeAttr(st.note)}">
    </div>
    <div class="status-col">
      <div class="status-buttons" data-id="${t.id}">${STATUS_ORDER.map((s) => `<button class="status-btn sel-${s} ${st.status === s ? "active" : ""}" data-id="${t.id}" data-status="${s}">${STATUS_LABEL[s]}</button>`).join("")}</div>
      <div class="topic-pct-row">
        <div class="topic-pct-bar-wrap">
          <div class="topic-pct-bar ${pctClass}" style="width:${pct}%"></div>
        </div>
        <span class="topic-pct-label ${pctClass}">${pct}%</span>
      </div>
      <div class="last-rev">${st.lastReviewed ? "📅 " + st.lastReviewed : "—"}</div>
    </div>
  </div>`;
      }

      function escapeHtml(s) {
        return (s || "").replace(
          /[&<>"']/g,
          (c) =>
            ({
              "&": "&amp;",
              "<": "&lt;",
              ">": "&gt;",
              '"': "&quot;",
              "'": "&#39;",
            })[c],
        );
      }
      function escapeAttr(s) {
        return escapeHtml(s);
      }

      /* =====================================================================
   QUIZ LOG
===================================================================== */
      function suggestStatusFromPct(pct) {
        if (pct >= 85) return "mastered";
        if (pct >= 65) return "good";
        return "weak";
      }
      function renderQuizLog(LIVE) {
        const allSessions = appState.sessions.slice();
        let html = `<div class="source-head"><h2>📝 Quiz Log — تحليل شامل</h2><div class="dash-sub" style="margin-top:6px">سجّل نتيجة كل كويز، وقيّم كل موضوع مرتبط بيها في نفس المكان — من غير ما ترجع تدور عليه في الشيتات.</div>
    <div class="quick-actions" style="margin-top:12px"><button class="btn small primary" id="newSessionBtn">+ جلسة جديدة (يدوي)</button><button class="btn small" id="expandAllSessionsBtn">🔽 افتح كل الجلسات</button><button class="btn small" id="collapseAllSessionsBtn">🔼 اقفل كل الجلسات</button></div></div>`;
        html += `<div class="qlog-summary">`;
        Object.keys(SOURCE_META).forEach((src) => {
          const srcSessions = allSessions.filter(
            (s) => s.src === src && Number(s.total) > 0,
          );
          if (!srcSessions.length) {
            html += `<div class="qlog-sum-card"><h4>${SOURCE_META[src].label}</h4><div class="dash-sub">لسه مفيش جلسات مسجلة</div></div>`;
          } else {
            const avg = Math.round(
              srcSessions.reduce(
                (a, s) => a + (Number(s.correct) / Number(s.total)) * 100,
                0,
              ) / srcSessions.length,
            );
            html += `<div class="qlog-sum-card"><h4>${SOURCE_META[src].label}</h4><div class="val">${avg}%</div><div class="dash-sub">متوسط ${srcSessions.length} جلسة</div></div>`;
          }
        });
        html += `</div>`;

        if (!allSessions.length) {
          html += `<div class="empty-state">لسه مفيش جلسات. أفضل طريقة تبدأ بيها: حدد مواضيع من أي شيت، وادوس "💾 احفظ كجلسة" في الـ Quiz Builder تحت — كده الجلسة هتيجي معاها المواضيع مربوطة تلقائي.</div>`;
          return html;
        }

        // #1 — filter by source + sort control
        const filterCounts = { all: allSessions.length };
        Object.keys(SOURCE_META).forEach(
          (src) =>
            (filterCounts[src] = allSessions.filter(
              (s) => s.src === src,
            ).length),
        );
        html += `<input type="text" class="qb-search" id="qlogSearchInput" placeholder="دور على جلسة بالتاريخ أو المواضيع أو الملاحظات..." value="${escapeAttr(qlogSearchQuery)}">`;
        html += `<div class="qlog-controls-row">`;
        html += `<div class="qb-filter-row" style="margin-bottom:0; flex:1;">`;
        html += `<button class="qb-filter-btn ${qlogSrcFilter === "all" ? "active-all" : ""}" data-qlog-filter="all">الكل <span class="qb-filter-count">${filterCounts.all}</span></button>`;
        Object.keys(SOURCE_META).forEach((src) => {
          if (!filterCounts[src]) return;
          html += `<button class="qb-filter-btn ${qlogSrcFilter === src ? "active-src" : ""}" data-qlog-filter="${src}">${SOURCE_META[src].label} <span class="qb-filter-count">${filterCounts[src]}</span></button>`;
        });
        html += `</div>`;
        html += `<select id="qlogSortSelect" class="qlog-sort-select">
    <option value="newest" ${qlogSort === "newest" ? "selected" : ""}>⏱ الأحدث الأول</option>
    <option value="oldest" ${qlogSort === "oldest" ? "selected" : ""}>⏱ الأقدم الأول</option>
    <option value="score-high" ${qlogSort === "score-high" ? "selected" : ""}>📈 الأعلى درجة الأول</option>
    <option value="score-low" ${qlogSort === "score-low" ? "selected" : ""}>📉 الأقل درجة الأول</option>
  </select>`;
        html += `</div>`;

        // apply filter
        let sessions = allSessions;
        if (qlogSrcFilter !== "all")
          sessions = sessions.filter((s) => s.src === qlogSrcFilter);
        // apply search (#4)
        const q = qlogSearchQuery.trim().toLowerCase();
        if (q) {
          sessions = sessions.filter((s) => {
            const haystack = [
              s.date,
              s.topics,
              s.notes,
              SOURCE_META[s.src] ? SOURCE_META[s.src].label : s.src,
            ]
              .join(" ")
              .toLowerCase();
            return haystack.indexOf(q) !== -1;
          });
        }
        // apply sort (#1)
        sessions = sessions.slice().sort((a, b) => {
          if (qlogSort === "oldest")
            return (a.createdAt || 0) - (b.createdAt || 0);
          if (qlogSort === "score-high") return scorePct(b) - scorePct(a);
          if (qlogSort === "score-low") return scorePct(a) - scorePct(b);
          return (b.createdAt || 0) - (a.createdAt || 0); // newest (default)
        });

        if (!sessions.length) {
          html += `<div class="empty-state">مفيش جلسات مطابقة للفلتر/البحث ده.</div>`;
        } else {
          sessions.forEach((s) => (html += renderSessionCard(s, LIVE)));
        }
        return html;
      }
      function scorePct(s) {
        const t = Number(s.total) || 0;
        return t ? Math.round(((Number(s.correct) || 0) / t) * 100) : -1;
      }
      function renderSessionCard(s, LIVE) {
        const correct = Number(s.correct) || 0,
          total = Number(s.total) || 0;
        const pct = total ? Math.round((correct / total) * 100) : null;
        const pctColor =
          pct === null
            ? "var(--muted)"
            : pct >= 80
              ? "var(--mastered)"
              : pct >= 60
                ? "var(--good)"
                : "var(--weak)";
        const topicIds = s.topicIds || [];

        let linkedHtml = "";
        if (topicIds.length) {
          const suggestion = pct !== null ? suggestStatusFromPct(pct) : null;
          linkedHtml += `<div style="margin-top:12px; padding-top:12px; border-top:1px dashed var(--border-soft);">`;
          linkedHtml += `<label style="font-size:10.5px; color:var(--muted); font-family:var(--mono); display:block; margin-bottom:8px;">📊 قيّم كل موضوع مرتبط بالجلسة دي:</label>`;

          linkedHtml += `<div class="ai-box">`;
          if (s.aiState === "loading") {
            linkedHtml += `<span class="dash-sub">🧠 Gemini بيحلل الملاحظات دلوقتي...</span>`;
          } else if (s.aiState === "ratelimited") {
            linkedHtml += `<span style="color:var(--good); font-size:12px;">⏳ ${escapeHtml(s.aiError || "الليميت خلص")} — هيعيد المحاولة تلقائيًا خلال <span class="countdown-text" id="aiCountdown-${s.id}">...</span></span>
        <div class="edit-form-actions" style="margin-top:8px;">
          <button class="btn small" data-ai-retry-now="${s.id}">🔄 حاول دلوقتي</button>
          <button class="btn small" data-ai-cancel="${s.id}">✍️ قيّم يدوي بدل كده</button>
        </div>`;
          } else if (s.aiState === "error") {
            linkedHtml += `<span style="color:var(--weak); font-size:12px;">⚠️ ${escapeHtml(s.aiError || "حصل خطأ")}</span>
        <div class="edit-form-actions" style="margin-top:8px;"><button class="btn small" data-ai-analyze="${s.id}">🔄 حاول تاني</button></div>`;
          } else if (s.aiAnalysis && s.aiAnalysis.ratings) {
            linkedHtml += `<div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:8px; flex-wrap:wrap; gap:8px;">
        <span style="font-size:11.5px; color:var(--accent);">🧠 تحليل Gemini جاهز</span>
        <div style="display:flex; gap:8px;"><button class="btn small primary" data-apply-ai="${s.id}">✅ طبّق كل اقتراحات AI</button><button class="btn small" data-ai-analyze="${s.id}">🔄 حلل تاني</button></div>
      </div>`;
            if (s.aiError) {
              linkedHtml += `<div style="font-size:11px; color:var(--weak); margin-bottom:8px;">⚠️ ${escapeHtml(s.aiError)}</div>`;
            }
            s.aiAnalysis.ratings.forEach((r) => {

      /* =====================================================================
   QUESTION BANK — parses the pasted "full quiz text" of every session
   into individual question cards (question + choices + correct answer +
   hint/rationale), so every quiz you've logged shows up as one running
   archive of Q&A you can browse and re-study, in the same review-style
   layout as the quiz app screenshots.
===================================================================== */
      function cleanQuizMd(s) {
        if (!s) return "";
        return s
          .replace(/\\_/g, "_")
          .replace(/\\times/g, "×")
          .replace(/\\%/g, "%")
          .replace(/\$/g, "")
          .replace(/\*\*/g, "")
          .trim();
      }

      /* Parses the markdown quiz format:
   ## N. Question text
   > 💡 **Hint:** ...
   - **A.** choice
   - **B.** choice
   > **Answer:** X
   > **Rationale:** ...
   Returns [] if the text doesn't look like this format at all. */
      function parseQuizMarkdown(rawText) {
        if (!rawText || !rawText.trim()) return [];
        const text = rawText.replace(/\r\n/g, "\n");
        const qRegex = /^##\s*(\d+)\.\s*(.+)$/gm;
        const starts = [];
        let m;
        while ((m = qRegex.exec(text)) !== null) {
          starts.push({
            num: parseInt(m[1], 10),
            qtext: cleanQuizMd(m[2]),
            index: m.index,
            bodyStart: qRegex.lastIndex,
          });
        }
        if (!starts.length) return [];
        const questions = [];
        for (let i = 0; i < starts.length; i++) {
          const block = text.slice(
            starts[i].bodyStart,
            i + 1 < starts.length ? starts[i + 1].index : text.length,
          );
          const hintM = block.match(/Hint:\*\*\s*(.+)/);
          const answerM = block.match(/Answer:\*\*\s*([A-D])/);
          const rationaleM = block.match(
            /Rationale:\*\*\s*([\s\S]+?)(?:\n---|\n##|$)/,
          );
          const choices = [];
          const choiceRegex = /^-\s*\*\*([A-D])\.\*\*\s*(.+)$/gm;
          let cm;
          while ((cm = choiceRegex.exec(block)) !== null) {
            choices.push({ letter: cm[1], text: cleanQuizMd(cm[2]) });
          }
          questions.push({
            num: starts[i].num,
            qtext: starts[i].qtext,
            hint: hintM ? cleanQuizMd(hintM[1]) : "",
            choices,
            answer: answerM ? answerM[1] : "",
            rationale: rationaleM
              ? cleanQuizMd(rationaleM[1]).replace(/\n+/g, " ").trim()
              : "",
          });
        }
        return questions;
      }

      /* Best-effort auto-detection of which question numbers the student marked
   wrong/skipped. Priority order:
   1) The structured "wrongNums" / "skippedNums" comma-separated fields —
      explicit and unambiguous, always trusted first when filled in.
   2) Free-text pattern matching over the raw quiz paste + notes, for
      sessions logged before those structured fields existed, or when the
      student just wrote prose instead of filling them in.
   Either way, a manual per-question status click always overrides both. */
      function extractNumberList(str) {
        return (str.match(/\d+/g) || []).map((n) => parseInt(n, 10));
      }
      function detectAutoStatus(
        rawText,
        notes,
        wrongNumsField,
        skippedNumsField,
      ) {
        const structuredWrong = extractNumberList(wrongNumsField || "");
        const structuredSkipped = extractNumberList(skippedNumsField || "");
        if (structuredWrong.length || structuredSkipped.length) {
          const wrong = new Set(structuredWrong);
          const skipped = new Set(structuredSkipped);
          skipped.forEach((n) => wrong.delete(n));
          return { wrong, skipped };
        }
        const combined = [rawText || "", notes || ""].join("\n");
        const wrong = new Set();
        const skipped = new Set();
        const wrongPatterns = [
          /wrong[^\d]{0,40}(\d+(?:\s*,\s*\d+)*)/gi,
          /(?:غلط[تي]?|أخطأت|اخطات)[^\d]{0,40}(\d+(?:\s*,\s*\d+)*)/gi,
        ];
        const skipPatterns = [
          /skip(?:ped)?[^\d]{0,40}(\d+(?:\s*,\s*\d+)*)/gi,
          /(?:سكب[تي]?|تخط[يت]ت|اتخط[يت]ت)[^\d]{0,40}(\d+(?:\s*,\s*\d+)*)/gi,
        ];
        wrongPatterns.forEach((re) => {
          let m;
          while ((m = re.exec(combined)) !== null) {
            extractNumberList(m[1]).forEach((n) => wrong.add(n));
          }
        });
        skipPatterns.forEach((re) => {
          let m;
          while ((m = re.exec(combined)) !== null) {
            extractNumberList(m[1]).forEach((n) => skipped.add(n));
          }
        });
        skipped.forEach((n) => wrong.delete(n)); // skipped takes precedence if a number matched both loosely
        return { wrong, skipped };
      }

      function ensureQuestionStatus(s) {
        if (!s.questionStatus) s.questionStatus = {};
        return s.questionStatus;
      }
      function getQuestionStatus(s, qnum, autoWrong, autoSkipped) {
        const manual = (s.questionStatus || {})[qnum];
        if (manual) return manual;
        if (autoSkipped.has(qnum)) return "skipped";
        if (autoWrong.has(qnum)) return "wrong";
        return "correct";
      }
      const QB_STATUS_LABEL = {
        correct: "✅ صح",
        wrong: "❌ غلط",
        skipped: "⏭ سكيب",
      };
      const QB_STATUS_ORDER = ["correct", "wrong", "skipped"];

      let qbSearchQuery = "";
      let qbStatusFilter = "all";
      const QB_FILTER_LABEL = {
        all: "الكل",
        wrong: "❌ غلط",
        skipped: "⏭ سكيب",
        correct: "✅ صح",
      };

      function renderQuestionCard(s, q, status) {
        const badge = `<span class="qb-badge ${status}">${QB_STATUS_LABEL[status]}</span>`;
        const choicesHtml = q.choices
          .map(
            (c) =>
              `<div class="qb-choice ${c.letter === q.answer ? "correct" : ""}">${c.letter === q.answer ? "✓ " : ""}${c.letter}. ${escapeHtml(c.text)}</div>`,
          )
          .join("");
        const statusBtns = QB_STATUS_ORDER.map(
          (st) =>
            `<button class="qb-status-btn ${status === st ? "active-" + st : ""}" data-qb-status="${st}" data-qb-session="${s.id}" data-qb-qnum="${q.num}">${QB_STATUS_LABEL[st]}</button>`,
        ).join("");
        return `<div class="qb-card" data-qb-card="${s.id}-${q.num}">
    <div class="qb-card-top">

      function renderQuestionBank(LIVE) {
        const sessions = appState.sessions
          .slice()
          .sort((a, b) => (b.createdAt || 0) - (a.createdAt || 0));

        // first pass: parse everything once, get global counts (unaffected by search/filter) for the filter bar
        const perSession = sessions
          .map((s) => {
            const parsed = parseQuizMarkdown(s.rawText);
            const auto = detectAutoStatus(
              s.rawText,
              s.notes,
              s.wrongNums,
              s.skippedNums,
            );
            const items = parsed.map((qq) => ({
              qq,
              status: getQuestionStatus(s, qq.num, auto.wrong, auto.skipped),
            }));
            return { s, items };
          })
          .filter((x) => x.items.length);

        const totals = { all: 0, wrong: 0, skipped: 0, correct: 0 };
        perSession.forEach(({ items }) =>
          items.forEach(({ status }) => {
            totals.all++;
            totals[status]++;
          }),
        );

        let html = `<div class="source-head"><h2>📚 بنك الأسئلة — كل الكويزات اللي حطيتها</h2>
    <div class="dash-sub" style="margin-top:6px">كل كويز لصقته نصه الكامل في 📝 Quiz Log بيتحول هنا لسلسلة أسئلة تقدر تراجعها، زي الـ Review في الكويز نفسه. اللي اتحدد غلط/سكيب بيتحدد تلقائي من الحقول اللي كتبتها، وتقدر تغيّره يدوي بالأزرار تحت كل سؤال.</div></div>
    <input type="text" class="qb-search" id="qbSearchInput" placeholder="دور في كل الأسئلة اللي حطيتها (بالعربي أو الإنجليزي)..." value="${escapeAttr(qbSearchQuery)}">
    <div class="qb-filter-row">${["all", "wrong", "skipped", "correct"].map((f) => `<button class="qb-filter-btn ${qbStatusFilter === f ? "active-" + f : ""}" data-qb-filter="${f}">${QB_FILTER_LABEL[f]} <span class="qb-filter-count">${totals[f]}</span></button>`).join("")}</div>`;

        const q = qbSearchQuery.trim().toLowerCase();
        let anyParsed = false;

        perSession.forEach(({ s, items }) => {
          let cards = items;
          if (qbStatusFilter !== "all") {
            cards = cards.filter(({ status }) => status === qbStatusFilter);
          }
          if (q) {
            cards = cards.filter(
              ({ qq }) =>
                (
                  qq.qtext +
                  " " +
                  qq.choices.map((c) => c.text).join(" ") +
                  " " +
                  qq.rationale
                )
                  .toLowerCase()
                  .indexOf(q) !== -1,
            );
          }
          if (!cards.length) return;
          anyParsed = true;
          const wrongCount = items.filter((c) => c.status === "wrong").length;
          const skipCount = items.filter((c) => c.status === "skipped").length;
          const meta = SOURCE_META[s.src] ? SOURCE_META[s.src].label : s.src;
          html += `<details class="qb-session" id="qb-session-${s.id}" open>
      <summary>
        <div><div class="qb-session-title">${escapeHtml(s.topics || "كويز بدون اسم")} — ${s.date || ""}</div>
        <div class="qb-session-sub">${meta} · ${items.length} سؤال · ${s.correct || "?"}/${s.total || "?"} · ${wrongCount} غلط · ${skipCount} سكيب${qbStatusFilter !== "all" ? ` · بيعرض ${cards.length} بس (فلتر: ${QB_FILTER_LABEL[qbStatusFilter]})` : ""}</div></div>
      </summary>
      <div class="qb-session-body">${cards.map(({ qq, status }) => renderQuestionCard(s, qq, status)).join("")}</div>
    </details>`;
        });

        if (!perSession.length) {
          html += `<div class="empty-state">لسه مفيش أي جلسة فيها نص كويز كامل ملزوق. روح لـ 📝 Quiz Log وحط نص الكويز كامل في خانة "الصق هنا الكويز كامل" في أي جلسة — هيتحول تلقائي لأسئلة هنا.</div>`;
        } else if (!anyParsed) {
          html += `<div class="empty-state">مفيش أسئلة مطابقة للفلتر/البحث ده.</div>`;
        }
        return html;
      }

      function arabicJoin(list) {
        if (list.length === 1) return list[0];
        if (list.length === 2) return list[0] + " و" + list[1];
        return list.slice(0, -1).join("، ") + "، و" + list[list.length - 1];

          // Studio's Quiz tool actually reads from free text. Difficulty and

          const promptLine = `من ملف ${fileName} بس، ركّز على ${topicNames}.`;
          combinedParts.push(

      <div style="font-size:11px; color:var(--muted); margin-top:4px;">${escapeHtml(suggestionHint)}</div>
    </div>`;
        });

        body.innerHTML =
